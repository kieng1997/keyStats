<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KeyStats Desktop Pet</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage, #background, #overlays, #overlays img {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
  }
  #stage { display: block; }
  #background { pointer-events: none; }
  #background img { display: block; width: 100%; height: 100%; object-fit: contain; }
  #overlays { pointer-events: none; }
  #overlays img { display: block; object-fit: contain; }
  #overlays img[hidden] { display: none; }
  #status {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    text-align: center;
    font: 12px/1.5 "Microsoft YaHei UI", "Segoe UI", sans-serif;
    color: #8a94a6;
    background: transparent;
    box-sizing: border-box;
    word-break: break-all;
  }
  #status[hidden] { display: none; }
  #status.error { color: #d9534f; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="background" hidden><img id="background-image" alt="" draggable="false"></div>
<div id="overlays"></div>
<div id="status" hidden></div>
<script src="vendor/live2dcubismcore.min.js"></script>
<script src="vendor/framework.js"></script>
<script src="input-state.js"></script>
<script src="viewer.js"></script>
</body>
</html>
